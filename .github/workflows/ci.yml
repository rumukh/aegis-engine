name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: build / test / lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary host (ENVIRONMENT.md). Ubuntu is included to prove
        # cross-OS determinism: the state-hash tests must produce identical output on both.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The committed root .npmrc pins the corporate proxy (ENVIRONMENT.md). Do not
      # override the registry here.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
