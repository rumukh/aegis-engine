name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary host (ENVIRONMENT.md). Ubuntu is included to prove
        # cross-OS determinism: the state-hash tests must produce identical output on both.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    # Measured locally on a 16-core Windows box under load from four concurrent sessions:
    # `npm ci` 112s + `npm run verify` 248s = 6 minutes. Hosted runners are 2-4 vCPU, so budget
    # 3x for the machine and 1.7x on top of that for a cold module cache and network variance:
    # 30 minutes is ~5x the measured local wall clock. This is a guard against a *hang*, not a
    # performance assertion -- GitHub's default is 360 minutes, which would burn six hours to
    # tell us nothing. If this ever fires, the answer is to find what hung, not to raise it.
    timeout-minutes: 30

    # The committed root .npmrc pins the corporate Azure Artifacts proxy, which is correct for
    # local development (ENVIRONMENT.md) and unreachable from a GitHub-hosted runner. An env var
    # outranks a project .npmrc in npm's config precedence, so this selects the public registry
    # for every npm invocation in the job — including npm invoked from inside `npm run verify` —
    # without splitting the gate into pieces.
    #
    # This alone is not enough, and the missing half is easy to get wrong: `npm ci` fetches
    # tarballs from the lockfile's own `resolved` URLs, not from the configured registry. The
    # committed lockfile therefore holds canonical `https://registry.npmjs.org/` URLs, which a
    # runner fetches literally and which npm's default `replace-registry-host=npmjs` rewrites
    # back to the proxy on a corporate machine. `test/lockfile-registry.test.ts` enforces both
    # halves; `scripts/canonicalise-lockfile.mjs` repairs the lockfile after a local install.
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm ci

      # `npm run verify` is the project's one real gate (docs/working-agreement.md §3):
      # tsc -b over every workspace project, then `tsc -p tsconfig.tests.json` which type-checks
      # every *test* file (each package's own tsconfig excludes them, and vitest transpiles without
      # checking, so nothing else does), then the whole vitest suite — which now includes the three
      # PoC games under games/ (CHARTER §4.3) — then eslint, the dependency-boundary check and
      # prettier. Invoking it as a single step is deliberate: it makes it impossible for this
      # workflow to drift out of sync with the gate everyone runs locally.
      #
      # `npm test` re-runs the build through its `pretest` hook, so the suite can never race a
      # stale or half-written `dist`.
      - name: Verify (build + typecheck tests + test + lint)
        run: npm run verify
