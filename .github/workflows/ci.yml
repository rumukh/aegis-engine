name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary host (ENVIRONMENT.md). Ubuntu is included to prove
        # cross-OS determinism: the state-hash tests must produce identical output on both.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    # Measured locally on a 16-core Windows box under load from four concurrent sessions:
    # `npm ci` 112s + `npm run verify` 248s = 6 minutes. Hosted runners are 2-4 vCPU, so budget
    # 3x for the machine and 1.7x on top of that for a cold module cache and network variance:
    # ~5x the measured local wall clock. This is a guard against a *hang*, not a performance
    # assertion -- GitHub's default is 360 minutes, which would burn six hours to tell us nothing.
    #
    # 45, not 30, and the correction is the same rule that this run's own test budgets were just
    # rewritten by: **an outer deadline that is smaller than the sum of the deadlines it contains
    # cannot let any of them fire.** A job killed at its timeout reports nothing about which test
    # was waiting for what -- exactly the mute failure the per-test budgets were resized to end.
    # Replacing eight mute test timeouts with one mute job timeout would be no progress at all.
    #
    # The arithmetic it now has to contain (see the deadline table in browser-playability.test.ts):
    #   browser-playability worst case  3x150 + 3x150 + 2x210 + 180 beforeAll = 1500s = 25 min
    #   rest of the suite on windows    ~580s at the measured 5.6x ubuntu ratio =  10 min
    #   npm ci on a cold cache          ~200s                                   =   3 min
    #                                                                             ------
    #                                                                              38 min
    # 45 leaves margin without approaching the 360-minute default. A healthy run of this job has
    # been measured at 3-11 minutes, so none of this is paid for unless something is already wrong.
    timeout-minutes: 45

    # The committed root .npmrc pins the corporate Azure Artifacts proxy, which is correct for
    # local development (ENVIRONMENT.md) and unreachable from a GitHub-hosted runner. An env var
    # outranks a project .npmrc in npm's config precedence, so this selects the public registry
    # for every npm invocation in the job — including npm invoked from inside `npm run verify` —
    # without splitting the gate into pieces.
    #
    # This alone is not enough, and the missing half is easy to get wrong: `npm ci` fetches
    # tarballs from the lockfile's own `resolved` URLs, not from the configured registry. The
    # committed lockfile therefore holds canonical `https://registry.npmjs.org/` URLs, which a
    # runner fetches literally and which npm's default `replace-registry-host=npmjs` rewrites
    # back to the proxy on a corporate machine. `test/lockfile-registry.test.ts` enforces both
    # halves; `scripts/canonicalise-lockfile.mjs` repairs the lockfile after a local install.
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm ci

      # `npm run verify` is the project's one real gate (docs/working-agreement.md §3):
      # tsc -b over every workspace project, then `tsc -p tsconfig.tests.json` which type-checks
      # every *test* file (each package's own tsconfig excludes them, and vitest transpiles without
      # checking, so nothing else does), then the whole vitest suite — which now includes the three
      # PoC games under games/ (CHARTER §4.3) — then eslint, the dependency-boundary check and
      # prettier. Invoking it as a single step is deliberate: it makes it impossible for this
      # workflow to drift out of sync with the gate everyone runs locally.
      #
      # `npm test` re-runs the build through its `pretest` hook, so the suite can never race a
      # stale or half-written `dist`.
      - name: Verify (build + typecheck tests + test + lint)
        run: npm run verify

      # A SECOND, INDEPENDENT PATH TO RED — deliberately outside `npm run verify`.
      #
      # Measured on this workflow, runs 30323223392 and 30324264768, both on `windows-latest`:
      # `npm run test` reported `(9 tests | 8 failed)` and the next link in verify's `&&` chain
      # started 1.1 seconds later, so the exit code was lost somewhere in npm's chain and the job
      # went green with eight failing tests. A separate run of the same tree reported nine browser
      # tests SKIPPED — a `beforeAll` that could not launch a browser — and also went green.
      #
      # `scripts/run-tests.mjs` refuses both shapes from inside verify. This step exists because
      # that refusal travels back through the very npm chain that was measured to drop it. Here
      # the runner observes the exit code directly, so the two paths cannot fail in the same way.
      # The report is written by the run above; if it is absent this step fails, which is correct —
      # a verify that produced no evidence is not a verify that passed.
      - name: Audit that the test run actually happened
        if: always()
        run: node scripts/audit-test-report.mjs .vitest-report.json
