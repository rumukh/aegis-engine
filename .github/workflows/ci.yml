name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary host (ENVIRONMENT.md). Ubuntu is included to prove
        # cross-OS determinism: the state-hash tests must produce identical output on both.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The committed root .npmrc pins the corporate proxy (ENVIRONMENT.md). Do not
      # override the registry here.
      - name: Install
        run: npm ci

      # `npm run verify` is the project's one real gate (docs/working-agreement.md §3):
      # tsc -b over every workspace project, then the whole vitest suite — which now includes
      # the three PoC games under games/ (CHARTER §4.3) — then eslint, the dependency-boundary
      # check and prettier. Invoking it as a single step is deliberate: it makes it impossible
      # for this workflow to drift out of sync with the gate everyone runs locally.
      #
      # `npm test` re-runs the build through its `pretest` hook, so the suite can never race a
      # stale or half-written `dist`.
      - name: Verify (build + test + lint)
        run: npm run verify
